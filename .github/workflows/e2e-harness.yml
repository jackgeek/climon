name: e2e-harness

on:
  pull_request:
    paths:
      - ".github/workflows/e2e-harness.yml"
      - "harness/**"
      - "rust/**"
      - "src/**"
      - "scripts/server-build.ts"
      - "scripts/compile.ts"
      - "package.json"
      - "bun.lock"
      - "docs/manual-tests/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Prepare E2E harness artifact root
        run: |
          mkdir -p .test-tmp/e2e-harness/${{ matrix.platform }}
          printf '%s\n' "${{ matrix.platform }}" > .test-tmp/e2e-harness/${{ matrix.platform }}/platform.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium (Ubuntu)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright Chromium (macOS and Windows)
        if: ${{ matrix.os != 'ubuntu-latest' }}
        run: bun run harness:install-browser

      - name: Run E2E harness doctor
        run: bun run harness -- doctor

      - name: Run E2E harness
        env:
          CLIMON_DISABLE_SETSID: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
        run: bun run harness -- run DAR-01 DAR-02 --artifact-root .test-tmp/e2e-harness/${{ matrix.platform }}

      - name: Upload E2E harness artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-harness-${{ matrix.platform }}
          path: .test-tmp/e2e-harness/${{ matrix.platform }}
          if-no-files-found: error

  aggregate:
    needs: run
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare E2E harness aggregate root
        run: mkdir -p .test-tmp/e2e-harness-results

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download E2E harness artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-harness-*
          merge-multiple: false
          path: .test-tmp/e2e-harness-results

      - name: Aggregate E2E harness reports
        id: aggregate
        continue-on-error: true
        run: bun run harness -- aggregate --results-root .test-tmp/e2e-harness-results

      - name: Append E2E harness summary
        if: ${{ always() }}
        run: |
          if [ -f .test-tmp/e2e-harness-results/summary.md ]; then
            cat .test-tmp/e2e-harness-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "E2E harness aggregate summary was not created." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload aggregate E2E harness outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-harness-results
          path: .test-tmp/e2e-harness-results
          if-no-files-found: error

      - name: Fail when aggregate reports blocking results
        if: ${{ steps.aggregate.outcome != 'success' }}
        run: exit 1
